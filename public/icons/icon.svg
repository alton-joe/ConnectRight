<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#000000"/>
  <!-- Two-nodes-connected mark: white left node, orange right node, white connection line.
       Sized to fill the maskable safe zone (inner ~80%) so the circular crop applied
       by Android adaptive icons / Samsung One UI notification renderer still shows the
       full brand mark recognizably at notification size. -->
  <line x1="160" y1="256" x2="352" y2="256" stroke="#ffffff" stroke-width="36" stroke-linecap="round"/>
  <circle cx="160" cy="256" r="84" fill="#ffffff"/>
  <circle cx="352" cy="256" r="84" fill="#f97316"/>
</svg>
